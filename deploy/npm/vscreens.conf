# VScreenS — proxy hosts para NPM.
# Copiar a /var/lib/docker/volumes/npm_data/_data/nginx/proxy_host/vscreens.conf
# y recargar NPM. El certificado origin.crt cubre *.inverpave.com.

map $http_upgrade $vscreens_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name vscreens.inverpave.com vscreens-app.inverpave.com vscreens-api.inverpave.com vscreens-tv.inverpave.com vscreens-erp.inverpave.com vscreens-status.inverpave.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vscreens.inverpave.com vscreens-app.inverpave.com vscreens-api.inverpave.com vscreens-tv.inverpave.com vscreens-erp.inverpave.com;

    ssl_certificate /data/nginx/ssl/origin.crt;
    ssl_certificate_key /data/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;
    proxy_read_timeout 720s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 720s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://vscreens-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vscreens_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}

# Estado / monitoreo (Uptime Kuma)
server {
    listen 443 ssl;
    http2 on;
    server_name vscreens-status.inverpave.com;

    ssl_certificate /data/nginx/ssl/origin.crt;
    ssl_certificate_key /data/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://vscreens-uptime:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vscreens_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
