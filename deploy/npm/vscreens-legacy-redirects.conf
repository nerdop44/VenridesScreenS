# Redirecciones 301 de los antiguos subdominios de VenridesScreenS
# hacia los nuevos dominios de VScreenS.
# Instalar en /var/lib/docker/volumes/npm_data/_data/nginx/proxy_host/
# y recargar NPM. No afecta a cafe.venrides.com ni al correo.

server {
    listen 80;
    server_name venrides.inverpave.com venrides-app.inverpave.com venrides-api.inverpave.com venrides-tv.inverpave.com venrides-erp.inverpave.com;
    location /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
        default_type text/plain;
    }
    location / {
        return 301 https://vscreens.inverpave.com$request_uri;
    }
}

server {
    listen 80;
    server_name screens.venrides.com;
    location /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
        default_type text/plain;
    }
    location / {
        return 301 https://vscreens.inverpave.com$request_uri;
    }
}

server {
    listen 80;
    server_name tv.venrides.com;
    location /.well-known/acme-challenge/ {
        root /data/letsencrypt-acme-challenge;
        default_type text/plain;
    }
    location / {
        return 301 https://vscreens-tv.inverpave.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name screens.venrides.com;
    ssl_certificate /data/nginx/ssl/venrides.crt;
    ssl_certificate_key /data/nginx/ssl/venrides.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://vscreens.inverpave.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tv.venrides.com;
