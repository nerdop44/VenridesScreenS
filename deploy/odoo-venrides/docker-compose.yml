services:
  venrides-screens-odoo:
    image: odoo:20.0
    container_name: venrides-screens-odoo
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/venrides-entrypoint.sh"]
    env_file:
      - /opt/venrides-screens/.env
    volumes:
      - ./scripts/entrypoint.sh:/usr/local/bin/venrides-entrypoint.sh:ro
      - ../../odoo-addons:/mnt/extra-addons:ro
      - venrides_screens_odoo_data:/var/lib/odoo
      - ../../releases:/opt/venrides-screens/releases:ro
    networks:
      - venrides-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1536M

  venrides-screens-gateway:
    image: nginx:alpine
    container_name: venrides-screens-gateway
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - venrides-screens-odoo
      - venrides-screens-admin
      - venrides-screens-tv
      - venrides-screens-landing
    networks:
      - venrides-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  venrides-screens-admin:
    build:
      context: ../../frontend-admin
      args:
        VITE_API_BASE_URL: https://venrides-api.inverpave.com
        VITE_TV_URL: https://venrides-tv.inverpave.com
    container_name: venrides-screens-admin
    restart: unless-stopped
    networks:
      - venrides-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  venrides-screens-tv:
    build: ../../frontend-tv
    container_name: venrides-screens-tv
    restart: unless-stopped
    networks:
      - venrides-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  venrides-screens-landing:
    build: ../../frontend-landing
    container_name: venrides-screens-landing
    restart: unless-stopped
    networks:
      - venrides-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  venrides_screens_odoo_data:
    name: venrides_screens_odoo_data

networks:
  venrides-net:
    name: venrides-net
    external: true
