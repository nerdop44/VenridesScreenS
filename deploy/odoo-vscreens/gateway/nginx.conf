# Gateway interno de VScreenS.
# NPM termina TLS y envía el tráfico aquí por la red vscreens-net.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# API
server {
    listen 80;
    server_name vscreens-api.inverpave.com;

    client_max_body_size 50m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        set $odoo_backend http://vscreens-odoo:8069;
        proxy_pass $odoo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}

# Odoo maestro
server {
    listen 80;
    server_name vscreens-erp.inverpave.com;

    client_max_body_size 100m;
    proxy_read_timeout 720s;
    proxy_send_timeout 720s;
    proxy_connect_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /websocket {
        set $odoo_ws_backend http://vscreens-odoo:8072;
        proxy_pass $odoo_ws_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
