services:
  db:
    image: postgres:15-alpine
    container_name: vscreens_db
    environment:
      POSTGRES_USER: ${DB_USER:-vscreens_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-vscreens_db}
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Use 5433 to avoid conflict with host's 5432 (Odoo)
    networks:
      - vscreens_network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: vscreens_cache
    networks:
      - vscreens_network
    restart: always

  backend:
    build: ./backend
    container_name: vscreens_api
    volumes:
      - ./backend:/app
      - ./logos:/logos # Sync logos with host and nginx
    ports:
      - "8005:8000" # Changed from 8000 to 8005 to avoid conflict with Portainer on VPS
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-vscreens_user}:${DB_PASSWORD:?DB_PASSWORD is required}@db/${DB_NAME:-vscreens_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - LOG_LEVEL=info
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - db
      - redis
    networks:
      - vscreens_network
    restart: always

  frontend-admin:
    build:
      context: ./frontend-admin
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://vscreens-api.inverpave.com}
        - VITE_TV_URL=${VITE_TV_URL:-https://vscreens-tv.inverpave.com}
    container_name: vscreens_admin
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - backend
    networks:
      - vscreens_network
    restart: always

  frontend-tv:
    build: ./frontend-tv
    container_name: vscreens_tv
    deploy:
      resources:
        limits:
          memory: 64M
    depends_on:
      - backend
    networks:
      - vscreens_network
    restart: always

  frontend-mobile:
    build: ./app-mobile
    container_name: vscreens_mobile
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - backend
    networks:
      - vscreens_network
    restart: always

  frontend-landing:
    build: ./frontend-landing
    container_name: vscreens_landing
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      - backend
    networks:
      - vscreens_network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: vscreens_proxy
    ports:
      - "8080:80"
      - "8081:81"
      - "8082:82"
      - "8090:83"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./logos:/app/logos
    depends_on:
      - backend
      - frontend-admin
      - frontend-tv
      - frontend-mobile
      - frontend-landing
    networks:
      - vscreens_network
    restart: always

networks:
  vscreens_network:
    driver: bridge

volumes:
  postgres_data:


